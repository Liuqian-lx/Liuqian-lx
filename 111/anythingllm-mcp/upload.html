<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AnythingLLM 工作台</title>
<style>
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:760px;margin:40px auto;padding:0 20px;color:#1f2733}
  h1{font-size:20px}
  .card{background:#fff;border:1px solid #e0e4e8;border-radius:8px;padding:16px;margin-bottom:16px}
  input[type=text],select{font-size:14px;padding:6px 8px;border:1px solid #cbd5e1;border-radius:6px;margin-right:8px}
  input[type=file]{display:block;margin:8px 0}
  button{background:#2563eb;color:#fff;border:0;border-radius:6px;padding:8px 16px;font-size:14px;cursor:pointer;margin-right:6px}
  button:disabled{background:#9ca3af;cursor:not-allowed}
  button.danger{background:#dc2626}
  button.sm{background:#e2e8f0;color:#1f2733;padding:4px 10px;font-size:12px}
  button.sm.danger{background:#fee2e2;color:#b91c1c}
  pre{white-space:pre-wrap;word-break:break-all;background:#0f172a;color:#d1fae5;border-radius:6px;padding:12px;font-size:13px;max-height:320px;overflow:auto}
  .ok{color:#059669;font-weight:600}
  .err{color:#dc2626;font-weight:600}
  .st{color:#7c3aed;font-weight:600}
  .docs{margin-top:8px}
  .folder{font-weight:600;margin:10px 0 4px;color:#334155}
  .doc{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 8px;border-bottom:1px solid #f1f5f9;font-size:14px}
  .doc .meta{color:#94a3b8;font-size:12px}
</style>
</head>
<body>
  <h1>AnythingLLM 工作台</h1>

  <div class="card" id="connCard">
    <label>API 地址：</label>
    <input type="text" id="apiUrl" style="min-width:220px">
    <label>API Key：</label>
    <input type="text" id="apiKey" style="min-width:220px">
    <button id="btnConnect">保存并连接</button>
  </div>

  <div class="card" id="wsCard">
    <label>工作区：</label>
    <select id="ws"></select>
    <button id="btnRefreshWs">刷新</button>
    <input type="text" id="newWsName" placeholder="新建工作区名称">
    <button id="btnNewWs">新建</button>
    <button class="danger" id="btnDelWs">删除当前工作区</button>
  </div>

  <div class="card">
    <label>上传文档并向量化（当前工作区）：</label>
    <span class="st" id="wsInfo"></span>
    <input type="file" id="file">
    <button id="btn">上传并向量化</button>
  </div>

  <div class="card">
    <h3 style="margin-top:0">工作区文档</h3>
    <div class="docs" id="docTree">加载中…</div>
  </div>

  <div class="card">
    <pre id="log">准备就绪。</pre>
  </div>

<script>
let API = localStorage.getItem("anythingllm_api") || "http://localhost:3001/api";
let KEY = localStorage.getItem("anythingllm_key") || "";
let WS_SLUG = "";

const $ = (id) => document.getElementById(id);
const log = (msg) => { $("log").textContent += "\n" + msg; $("log").scrollTop = $("log").scrollHeight; };
const headers = () => ({ "Authorization": "Bearer " + KEY, "Content-Type": "application/json" });

async function api(path, opts = {}) {
  const r = await fetch(API + path, { headers: headers(), ...opts });
  if (!r.ok) throw new Error("HTTP " + r.status + " " + (await r.text()).slice(0, 200));
  const txt = await r.text();
  return txt ? JSON.parse(txt) : null;
}

async function loadWorkspaces() {
  try {
    const data = await api("/v1/workspaces");
    const sel = $("ws");
    sel.innerHTML = "";
    for (const w of data.workspaces) {
      const o = document.createElement("option");
      o.value = w.slug; o.textContent = w.name + "  (" + w.slug + ")";
      sel.appendChild(o);
    }
    if (!WS_SLUG && sel.options.length) WS_SLUG = sel.value;
    sel.value = WS_SLUG;
    log("已加载 " + data.workspaces.length + " 个工作区");
    await loadDocs();
  } catch (e) {
    log(".err 加载工作区失败：" + e);
  }
}

function folderOf(docpath) {
  const i = docpath.lastIndexOf("/");
  return i > 0 ? docpath.slice(0, i) : "根目录";
}
function nameOf(docpath) {
  const i = docpath.lastIndexOf("/");
  return i >= 0 ? docpath.slice(i + 1) : docpath;
}

async function loadDocs() {
  if (!WS_SLUG) return;
  const box = $("docTree");
  box.textContent = "加载中…";
  try {
    const data = await api("/v1/workspace/" + WS_SLUG);
    const docs = data.workspace && data.workspace[0] ? data.workspace[0].documents : [];
    box.innerHTML = "";
    $("wsInfo").textContent = "工作区：" + data.workspace[0].name;
    if (!docs.length) { box.textContent = "（空）"; log("工作区无文档"); return; }
    const folders = {};
    for (const d of docs) {
      const f = folderOf(d.docpath || "");
      (folders[f] = folders[f] || []).push(d);
    }
    for (const f of Object.keys(folders).sort()) {
      const ft = document.createElement("div");
      ft.className = "folder";
      ft.textContent = f + "（" + folders[f].length + "）";
      box.appendChild(ft);
      for (const d of folders[f]) {
        const row = document.createElement("div");
        row.className = "doc";
        const info = document.createElement("span");
        info.innerHTML = "";
        const title = document.createElement("span");
        title.textContent = d.title || nameOf(d.docpath || "");
        const meta = document.createElement("span");
        meta.className = "meta";
        meta.textContent = d.docpath || "";
        info.appendChild(title);
        info.appendChild(document.createElement("br"));
        info.appendChild(meta);
        const del = document.createElement("button");
        del.className = "sm danger";
        del.textContent = "删除";
        del.addEventListener("click", () => deleteDoc(d.docpath, d.title));
        row.appendChild(info);
        row.appendChild(del);
        box.appendChild(row);
      }
    }
    log("已加载文档树：" + docs.length + " 个文档");
  } catch (e) {
    box.textContent = "加载失败";
    log(".err 加载文档失败：" + e);
  }
}

async function deleteDoc(docpath, title) {
  if (!confirm("确认删除文件「" + (title || docpath) + "」？删除后将从工作区移除并清除向量。")) return;
  try {
    await api("/system/remove-documents", { method: "DELETE", body: JSON.stringify({ names: [docpath] }) });
    log(".ok 已删除：" + (title || docpath));
    await loadDocs();
  } catch (e) {
    log(".err 删除失败：" + e);
  }
}

async function createWs() {
  const name = $("newWsName").value.trim();
  if (!name) { log(".err 请输入工作区名称"); return; }
  try {
    const r = await api("/v1/workspace/new", { method: "POST", body: JSON.stringify({ name }) });
    WS_SLUG = r.workspace.slug;
    log(".ok 已创建工作区：" + r.workspace.name);
    $("newWsName").value = "";
    await loadWorkspaces();
  } catch (e) { log(".err 创建工作区失败：" + e); }
}

async function deleteWs() {
  if (!WS_SLUG) return;
  if (!confirm("确认删除整个工作区「" + WS_SLUG + "」？该操作不可恢复！")) return;
  try {
    await api("/workspace/" + WS_SLUG, { method: "DELETE" });
    WS_SLUG = "";
    log(".ok 已删除工作区：" + WS_SLUG);
    await loadWorkspaces();
  } catch (e) { log(".err 删除工作区失败：" + e); }
}

$("ws").addEventListener("change", () => { WS_SLUG = $("ws").value; loadDocs(); });
$("btnRefreshWs").addEventListener("click", loadWorkspaces);
$("btnNewWs").addEventListener("click", createWs);
$("btnDelWs").addEventListener("click", deleteWs);

$("btnConnect").addEventListener("click", () => {
  const url = $("apiUrl").value.trim().replace(/\/+$/, "");
  const key = $("apiKey").value.trim();
  if (!url || !key) { log(".err 请填写 API 地址和 Key"); return; }
  API = url;
  KEY = key;
  WS_SLUG = "";
  localStorage.setItem("anythingllm_api", url);
  localStorage.setItem("anythingllm_key", key);
  log(".ok 已保存连接配置");
  loadWorkspaces();
});

$("btn").addEventListener("click", async () => {
  const file = $("file").files[0];
  if (!file) { log(".err 请先选择文件"); return; }
  if (!WS_SLUG) { log(".err 请先选择工作区"); return; }
  $("btn").disabled = true;

  const fd = new FormData();
  fd.append("file", file);
  fd.append("addToWorkspaces", WS_SLUG);

  log(".st [1/3] 上传 " + file.name + " 到工作区 " + WS_SLUG + " …");
  try {
    const r = await fetch(API + "/v1/document/upload", { method: "POST", headers: { Authorization: "Bearer " + KEY }, body: fd });
    const data = await r.json();
    if (!data.success) { log(".err 上传失败: " + JSON.stringify(data)); return; }
    const doc = data.documents[0];
    log("上传成功：title=" + doc.title + ", location=" + doc.location);
    log(".st [2/3] 等待向量化嵌入…");
    await waitEmbedded(doc.location);
    await loadDocs();
  } catch (e) {
    log(".err 上传出错: " + e);
  } finally {
    $("btn").disabled = false;
  }
});

async function waitEmbedded(location, timeout = 120000) {
  const start = Date.now();
  while (Date.now() - start < timeout) {
    await new Promise((res) => setTimeout(res, 2000));
    try {
      const r = await fetch(API + "/v1/workspace/" + WS_SLUG, { headers: headers() });
      const data = await r.json();
      const ws = data.workspace && data.workspace[0];
      if (ws && Array.isArray(ws.documents)) {
        const found = ws.documents.find((d) => d.docpath === location);
        if (found) {
          log(".ok [3/3] 已完成向量化嵌入！docpath=" + found.docpath);
          return found;
        }
      }
    } catch (e) {
      log("轮询出错（继续）: " + e);
    }
  }
  log(".err 等待嵌入超时（120s）。文档可能仍在处理，可在 AnythingLLM 界面查看。");
}

$("apiUrl").value = API;
$("apiKey").value = KEY;
if (KEY) {
  loadWorkspaces();
} else {
  log("请填写 API 地址和 Key，然后点击「保存并连接」。");
}
</script>
</body>
</html>
